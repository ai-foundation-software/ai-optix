name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }} / Py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python Dependencies
        shell: bash
        run: |
          uv pip install --system -r requirements-base.txt

          # Platform-specific Torch installation
          if [ "${{ runner.os }}" == "macOS" ]; then
            # macOS (ARM64) uses standard PyPI wheels
            uv pip install --system torch==2.3.1
          else
            # Linux/Windows use CPU-specific wheels from PyTorch index
            uv pip install --system -r requirements-cpu.txt
          fi

          # Install dev/test dependencies
          uv pip install --system pytest pytest-cov ruff maturin

      - name: Lint (Ruff)
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: ruff check .

      - name: Lint (Rust)
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          cargo fmt --all -- --check
          cargo clippy -- -D warnings

      - name: Build Wheel
        run: |
          maturin build --release --out dist

      - name: Install Wheel
        shell: bash
        run: |
          uv pip install --system dist/*.whl

      - name: Run Tests
        run: |
          pytest tests/ --cov=ai_optix --cov-report=term

  docs-check:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install MkDocs
        run: uv pip install --system mkdocs mkdocs-material mkdocs-get-deps
      - name: Build Docs
        run: |
          mkdocs build --strict || mkdocs build
