[package]
name = "ai_optix_rust"
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "ai_optix_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
tokio = { version = "1.0", features = ["full"] }
rayon = "1.7"
numpy = "0.23"
sysinfo = "0.30"
serde = { version = "1.0", features = ["derive"] }
crossbeam = "0.8"
parking_lot = "0.12"
lazy_static = "1.4"
nvml-wrapper = { version = "0.9", optional = true }
triton-client = { version = "0.1", optional = true }

[build-dependencies]
cmake = "0.1"

[features]
default = ["with_kernels"]
nvml = ["nvml-wrapper"]
triton = ["triton-client"]
with_kernels = []
